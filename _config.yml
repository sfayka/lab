title: Knox Analytics Lab
description: >-
  Practical writing from Knox Analytics on AI strategy, agent operations,
  and shipping software that holds up for SMBs. Technical experiments and
  honest analysis — no fluff, no gated content.
author: Knox Analytics
url: https://lab.knoxanalytics.com

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

paginate: 10
paginate_path: /page:num/

permalink: /posts/:title/

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  title: Knox Analytics Lab
  description: Essays and experiments on AI ops, agents, and shipping software.

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - next.config.mjs
  - tsconfig.json
  - components.json
  - app
  - components
  - hooks
  - lib
  - styles
  - tasks
  - distribution
