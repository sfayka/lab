<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <meta name="author" content="{{ site.author }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon-ka.svg?v=2' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/favicon-ka.svg?v=2' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
</head>

<body>
  <script>
    // Theme initialization - runs before body renders to prevent flash
    (function () {
      // Light (cream) by default to match knoxanalytics.com; a saved choice still wins.
      const theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <header>
    <nav class="container">
      <a href="{{ '/' | relative_url }}" class="nav-brand">Knox Lab</a>
      <div class="nav-links">
        <a href="https://knoxanalytics.com" class="nav-link">knoxanalytics.com →</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="footer-content container">
      <p class="footer-text">&copy; {{ site.time | date: '%Y' }} {{ site.author }}</p>
      <div class="footer-links">
        <a href="https://knoxanalytics.com">knoxanalytics.com</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        <a href="https://github.com/sfayka">GitHub</a>
      </div>
    </div>
  </footer>

  <script>
    // Theme toggle functionality
    const toggle = document.getElementById('theme-toggle');
    const icon = document.getElementById('theme-icon');
    const html = document.documentElement;

    function updateThemeIcon() {
      icon.textContent = html.classList.contains('dark') ? '☀️' : '🌙';
    }

    toggle.addEventListener('click', () => {
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeIcon();
    });

    updateThemeIcon();
  </script>
</body>

</html>
